<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IT Wars: Free Multiplayer Office Shooter in Your Browser</title>
    <meta name="description" content="IT Wars is a free, blocky first-person office shooter for your browser. Host a room, share a 4-letter code and play with friends over LAN. No install." />
    <meta name="keywords" content="IT Wars, browser shooter, multiplayer FPS, LAN party game, office deathmatch, voxel shooter, free browser game, three.js game, WebGL" />
    <meta name="author" content="Barak Gotesman" />
    <meta name="application-name" content="IT Wars" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />

    <!-- Icons and installable-app manifest (generated by `npm run make:icons`). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (Discord, Slack, Facebook, LinkedIn, X). The absolute og:image / og:url are added at build time when SITE_URL is set. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IT Wars" />
    <meta property="og:title" content="IT Wars: Free Multiplayer Office Shooter" />
    <meta property="og:description" content="Have you tried turning them off? A blocky first-person office deathmatch in your browser. Host a room, share a code, play with friends over LAN." />
    <meta property="og:image:alt" content="IT Wars: a pixel-art sysadmin with glasses and a red tie next to the game title" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IT Wars: Free Multiplayer Office Shooter" />
    <meta name="twitter:description" content="Have you tried turning them off? A blocky first-person office deathmatch in your browser." />
    <meta name="twitter:image:alt" content="IT Wars: a pixel-art sysadmin with glasses and a red tie next to the game title" />

    <!-- Structured data so search engines understand this is a free multiplayer browser game. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "IT Wars",
        "description": "A free, blocky first-person office deathmatch you play in your browser. Host a room, share a code and play with friends over a LAN.",
        "genre": ["Shooter", "Multiplayer", "Action"],
        "gamePlatform": "Web browser (desktop)",
        "operatingSystem": "Any desktop browser with WebGL",
        "applicationCategory": "Game",
        "playMode": "MultiPlayer",
        "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 2, "maxValue": 8 },
        "inLanguage": "en",
        "author": { "@type": "Person", "name": "Barak Gotesman" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body class="m-0 overflow-hidden bg-black font-sans text-ink">
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;background:#0b0d12;color:#f4f4f1;font-family:system-ui,sans-serif">
        IT Wars is a browser game and needs JavaScript. Please enable it to play.
      </div>
    </noscript>
    <!-- The game view. Everything else on screen is React, mounted into #root (src/client/ui). -->
    <canvas id="game" class="block h-screen w-screen" role="img" aria-label="IT Wars game view"></canvas>
    <div id="root"></div>

    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
